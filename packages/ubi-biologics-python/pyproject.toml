[project]
name = "ubi-biologics-python"
version = "0.1.0a1"
description = "Typed Python client and durable scientific workflows for Ubi Biologics"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "UniBio Intelligence"}]
dependencies = ["httpx>=0.27,<0.29", "attrs>=23.2", "python-dateutil>=2.9,<3"]

[project.urls]
Homepage = "https://github.com/unibio-intelligence/ubi-biologics-toolkit"
Repository = "https://github.com/unibio-intelligence/ubi-biologics-toolkit"
Issues = "https://github.com/unibio-intelligence/ubi-biologics-toolkit/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubi_biologics_client", "src/ubi_biologics_workflows"]
