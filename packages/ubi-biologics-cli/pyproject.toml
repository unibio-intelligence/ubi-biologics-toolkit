[project]
name = "ubi-biologics-cli"
version = "0.1.0a1"
description = "Command-line client for the Ubi Biologics platform"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
license-files = ["LICENSE"]
authors = [{name = "UniBio Intelligence"}]
dependencies = ["fastmcp==4.1.2", "httpx2==2.13.0", "keyring>=25,<26", "py-key-value-aio[keyring]==0.4.5"]

[project.urls]
Homepage = "https://github.com/unibio-intelligence/ubi-biologics-toolkit"
Repository = "https://github.com/unibio-intelligence/ubi-biologics-toolkit"
Issues = "https://github.com/unibio-intelligence/ubi-biologics-toolkit/issues"

[project.scripts]
ubi-biologics-cli = "ubi_cli.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubi_cli"]
